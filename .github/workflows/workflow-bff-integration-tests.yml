name: BFF integration tests

on:
  workflow_call:
  # PRs targeting main run this through workflow-build-and-test.yml.
  pull_request:
    branches-ignore: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  integration-test:
    name: Redis and PostgreSQL regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:6.2-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-test
          POSTGRES_DB: bff_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d bff_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Run BFF integration tests
        run: pnpm --filter bff test:integration
        env:
          TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}
          REDIS_CONNECTION_STRING: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}
          TEST_DATABASE_URL: postgres://postgres:integration-test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/bff_test
